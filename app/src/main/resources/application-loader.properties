spring.main.web-application-type=none

sns.loader.users=1000000
sns.loader.posts=10000000
sns.loader.threads=8
sns.loader.batch-size=1000

spring.datasource.hikari.maximum-pool-size=${sns.loader.threads}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Cassandra: the keyspace is created by the loader
sns.cassandra.use-keyspace=false
