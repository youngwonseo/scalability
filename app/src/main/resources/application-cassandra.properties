# S5: Cassandra storage. Activate with SPRING_PROFILES_ACTIVE=cassandra
sns.storage=cassandra
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

sns.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost:9042}
sns.cassandra.local-datacenter=${CASSANDRA_DC:datacenter1}
sns.cassandra.keyspace=sns
sns.cassandra.replication-factor=${CASSANDRA_RF:3}
# Same guarantee as a single MySQL primary: reads see acknowledged writes (R + W > RF)
sns.cassandra.consistency=LOCAL_QUORUM
sns.cassandra.request-timeout=3s
