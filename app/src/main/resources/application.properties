spring.application.name=sns

# Request concurrency is bounded by the DB connection pool, not by a servlet thread pool
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sns}?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=${DB_USERNAME:sns}
spring.datasource.password=${DB_PASSWORD:sns}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=3000

# Unique per app instance (1..31)
sns.worker-id=${WORKER_ID:1}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
