# S6: MySQL sharded by user. Activate with SPRING_PROFILES_ACTIVE=sharded
sns.storage=sharded
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Comma-separated JDBC URLs; shard i = (userId % 1024) % N. N must divide 1024 (2, 4, 8, ...).
sns.shard.urls=${DB_SHARD_URLS:}
