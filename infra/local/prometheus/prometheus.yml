global:
  scrape_interval: 5s

# Targets are written by infra/local/up.py for the current topology
scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/targets/app-targets.json"]
        refresh_interval: 5s
  - job_name: mysql
    file_sd_configs:
      - files: ["/etc/prometheus/targets/mysql-targets.json"]
        refresh_interval: 5s
