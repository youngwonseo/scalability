global:
  scrape_interval: 5s

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    file_sd_configs:
      # written by infra/local/up.py for the current number of app instances
      - files: ["/etc/prometheus/targets/app-targets.json"]
        refresh_interval: 5s
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
