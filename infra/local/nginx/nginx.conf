worker_processes auto;
events {
    worker_connections 10240;
}
http {
    access_log off;

    upstream app {
        server app1:8080;
        server app2:8080;
        keepalive 256;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
